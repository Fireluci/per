```html
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Opening Telegram…</title>
<style>
:root {
  --bg:#f4f6f8; --card:#fff; --text:#16202a;
  --muted:#5b6b7a; --accent:#229ed9; --line:#dbe2e8;
}
@media(prefers-color-scheme:dark) {
  :root {
    --bg:#0f1720; --card:#17212b; --text:#e8eef3;
    --muted:#8fa1b2; --accent:#4fb6e8; --line:#26333f;
  }
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; display:grid; place-items:center;
  padding:16px; background:var(--bg); color:var(--text);
  font:16px/1.5 system-ui,sans-serif;
}
main {
  width:100%; max-width:420px; background:var(--card);
  border:1px solid var(--line); border-radius:16px;
  padding:28px 24px; text-align:center;
}
h1 { font-size:20px; margin:0 0 6px; }
p { margin:0 0 18px; color:var(--muted); }
a.btn {
  display:block; padding:13px 16px; margin:10px 0;
  border-radius:10px; text-decoration:none; font-weight:600;
  border:1px solid var(--accent); color:var(--accent);
}
a.btn.primary { background:var(--accent); color:white; }
.small { font-size:13px; margin:18px 0 6px; color:var(--muted); }
#bad { display:none; }
</style>
</head>
<body>
<main>
  <div id="ok">
    <h1>Open Telegram</h1>
    <p>If Telegram does not open automatically, tap below.</p>
    <a id="main" class="btn primary" href="#">Open Telegram</a>
    <div id="backups"></div>
  </div>
  <div id="bad">
    <h1>Invalid link</h1>
    <p>The link has no valid start parameter. Please check the original link.</p>
  </div>
</main>

<script>
const BOTS = [
  "ApnaFlix1Bot"
];

(function () {
  const params = new URLSearchParams(location.search);
  const payload = params.get("s") || params.get("start") || "";

  const validPayload = /^[A-Za-z0-9_-]{1,64}$/.test(payload);
  const validBots = BOTS.length > 0 &&
    BOTS.every(bot => /^[A-Za-z0-9_]{5,32}$/.test(bot));

  if (!validPayload || !validBots) {
    document.getElementById("ok").style.display = "none";
    document.getElementById("bad").style.display = "block";
    return;
  }

  const web = bot =>
    "https://t.me/" + bot + "?start=" + encodeURIComponent(payload);

  const main = document.getElementById("main");
  main.href = web(BOTS[0]);
  main.textContent = "Open @" + BOTS[0];

  if (BOTS.length > 1) {
    const box = document.getElementById("backups");
    const label = document.createElement("div");
    label.className = "small";
    label.textContent = "Not working? Try a backup bot:";
    box.appendChild(label);

    BOTS.slice(1).forEach(bot => {
      const a = document.createElement("a");
      a.className = "btn";
      a.href = web(bot);
      a.textContent = "Open @" + bot;
      box.appendChild(a);
    });
  }
})();
</script>
</body>
</html>
