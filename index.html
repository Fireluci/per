<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Opening Telegram…</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#16202a; --muted:#5b6b7a; --accent:#229ed9; --line:#dbe2e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1720; --card:#17212b; --text:#e8eef3; --muted:#8fa1b2; --accent:#4fb6e8; --line:#26333f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line);
         border-radius:16px; padding:28px 24px; text-align:center; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { margin:0 0 18px; color:var(--muted); }
  a.btn { display:block; padding:13px 16px; margin:10px 0; border-radius:10px; text-decoration:none;
          font-weight:600; border:1px solid var(--accent); color:var(--accent); }
  a.btn.primary { background:var(--accent); color:#fff; }
  .small { font-size:13px; margin:18px 0 6px; color:var(--muted); }
  #bad { display:none; }
</style>
</head>
<body>
<main>
  <div id="ok">
    <h1 id="title">Opening Telegram…</h1>
    <p id="sub">If nothing happens, tap the button below.</p>
    <a id="main" class="btn primary" href="#">Open in Telegram</a>
    <div id="backups"></div>
  </div>
  <div id="bad">
    <h1>Invalid link</h1>
    <p>This link is incomplete or damaged.</p>
  </div>
</main>

<script>
// ============================================================================
//  THE ONLY PART YOU EVER EDIT
//  List your bot usernames WITHOUT the @. The FIRST one is opened automatically.
//  If your bot is banned: put a new bot first (or remove the dead one) and
//  save the file. Every link you ever shared keeps working.
//  Every bot must be an admin of the same DB channel.
// ============================================================================
const BOTS = [
  "ApnaFlix1Bot",
  // "MyBackupBot",
];
// ============================================================================

(function () {
  const payload = new URLSearchParams(location.search).get("s") || "";
  // Payloads are URL-safe base64 only; anything else is rejected.
  if (!/^[A-Za-z0-9_-]{4,512}$/.test(payload) || BOTS.length === 0) {
    document.getElementById("ok").style.display = "none";
    document.getElementById("bad").style.display = "block";
    return;
  }

  const web = (bot) => "https://t.me/" + bot + "?start=" + payload;

  const main = document.getElementById("main");
  main.href = web(BOTS[0]);
  main.textContent = "Open @" + BOTS[0];

  if (BOTS.length > 1) {
    const box = document.getElementById("backups");
    const label = document.createElement("div");
    label.className = "small";
    label.textContent = "Not working? Try a backup bot:";
    box.appendChild(label);
    BOTS.slice(1).forEach(function (bot) {
      const a = document.createElement("a");
      a.className = "btn";
      a.href = web(bot);
      a.textContent = "Open @" + bot;
      box.appendChild(a);
    });
  }

  // Go straight to the first bot.
  setTimeout(function () { location.replace(web(BOTS[0])); }, 300);
})();
</script>
</body>
</html>
